<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Send text · Frank Lucido</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png">
<style>
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6fb;color:#1b2333}
.top{background:#0f2d5c;color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center}
.top img{width:44px;height:44px;border-radius:10px;border:2px solid #fff}
.c{max-width:520px;margin:0 auto;padding:18px}
.to{color:#5a6476;font-size:14px;margin-bottom:8px}
.bubble{background:#1f6fd0;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#0f2d5c;color:#fff;font:700 18px/1.2 inherit;font-family:inherit;text-decoration:none;border:0;border-radius:12px;padding:16px;margin-top:16px;cursor:pointer}
.btn.g{background:#fff;color:#0f2d5c;border:2px solid #0f2d5c}
.s{font-size:14px;color:#5a6476;margin-top:14px}
</style></head><body>
<div class="top"><img src="apple-touch-icon.png" alt=""><div><b>Frank Lucido</b><br><span style="font-size:13px;color:#c8d6ee">Text ready to send</span></div></div>
<div class="c">
<div class="to" id="to"></div>
<div class="bubble" id="b"></div>
<a class="btn" id="open" href="#">Open in Messages</a>
<button class="btn g" id="copy" type="button">Copy text</button>
<p class="s" id="note">Messages opens with this filled in. You hit send there.</p>
</div>
<script>
(function(){
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)}
var raw=(location.hash||'').slice(1)||(new URLSearchParams(location.search).get('d')||''),p=null;
try{p=JSON.parse(dec(raw))}catch(e){}
var b=document.getElementById('b'),o=document.getElementById('open');
if(!p||typeof p.b!=='string'){b.textContent='Nothing to send. Go back and tap the send button again.';o.style.display='none';document.getElementById('copy').style.display='none';return}
var n=String(p.n||'').replace(/[^0-9+]/g,'');
var href='sms:'+n+'?&body='+encodeURIComponent(p.b);
window.__sms=href;
b.textContent=p.b;if(n)document.getElementById('to').textContent='To: '+n.replace(/^(\+?1)?(\d{3})(\d{3})(\d{4})$/,'$2-$3-$4');
o.href=href;
document.getElementById('copy').addEventListener('click',function(){var t=p.b,done=function(){document.getElementById('copy').textContent='Copied'};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){});else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}});
if(!/[?&]noauto/.test(location.search))setTimeout(function(){try{location.href=href}catch(e){}},400);
})();
</script>
</body></html>
